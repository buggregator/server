  /auth/sso/callback:
    get:
      tags:
      - Auth
      operationId: ssoCallback
      summary: OAuth2 callback; redirects to /login?token=<jwt>[&return_to=<path>]
      security: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the UI with the token in `token`
        '400':
          description: Bad callback (plain text)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Login failed (plain text)
          content:
            text/plain:
              schema:
                type: string
      description: Only when auth is on.
  /auth/sso/login:
    get:
      tags:
      - Auth
      operationId: ssoLogin
      summary: Start the SSO login (only when auth is on)
      security: []
      parameters:
      - name: return_to
        in: query
        description: A path of this server to open after sign-in (`/#/events/sentry/<uuid>`). Only a path starting with
          one `/`; anything else is ignored. The callback passes it on as `return_to` of `/login`.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the OAuth2 provider
  /connection/websocket:
    get:
      tags:
      - Server
      operationId: websocket
      summary: WebSocket (Centrifugo v5 JSON protocol) with live events
      description: Clients subscribe to `events.project.{key}`. `/ws` is an alias. With auth on, the JWT goes in the `token`
        of the Centrifugo `connect` command.
      security: []
      responses:
        '101':
          description: Switching protocols
  /metrics:
    get:
      tags:
      - Metrics
      operationId: getPrometheusMetrics
      summary: Prometheus metrics (when metrics are on and metrics.addr is empty; else on that address)
      security: []
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /ws:
    get:
      tags:
      - Server
      operationId: websocketAlias
      summary: Alias of /connection/websocket
      security: []
      responses:
        '101':
          description: Switching protocols
components:
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: JWT from the SSO login. Needed only when auth is on.
  parameters:
    CronSlug:
      name: slug
      in: path
      required: true
      description: Monitor slug, unique in its project.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,128}$
    CronProject:
      name: project
      in: query
      description: Project key (a ping may use the X-Buggregator-Project header instead). Default `default`.
      schema:
        type: string
    EventUUID:
      name: uuid
      in: path
      required: true
      schema:
        type: string
    EventType:
      name: type
      in: query
      description: Only events of this type (`sentry`, `smtp`, `monolog`, `var-dump`, `ray`, `inspector`, `profiler`, `http-dump`,
        `sms`, `broadcast`, `html`, ...)
      schema:
        type: string
    Project:
      name: project
      in: query
      description: Only events of this project key
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Max events. Default `ui.default_limit` (unset = no limit); capped by `ui.max_limit` (default 5000).
      schema:
        type: integer
        minimum: 1
    Offset:
      name: offset
      in: query
      description: Events to skip. Wins over `page`.
      schema:
        type: integer
        minimum: 0
    Page:
      name: page
      in: query
      description: 1-based page of `limit` events, used when `offset` is absent.
      schema:
        type: integer
        minimum: 1
    From:
      name: from
      in: query
      description: Lower time bound, unix seconds or RFC3339.
      schema:
        type: string
    To:
      name: to
      in: query
      description: Upper time bound, unix seconds or RFC3339.
      schema:
        type: string
    FacetHost:
      name: host
      in: query
      description: 'Only events from these machines (repeat for several; prefix `not.` to exclude, e.g. `not.host=web-1`).
        Sentry server_name, Ray/Inspector/profiler hostname, Monolog extra.hostname, request host of dumps and HTTP dumps.'
      schema:
        type: array
        items:
          type: string
      explode: true
    FacetEnv:
      name: env
      in: query
      description: Only events of these environments (Sentry environment). Repeatable; `not.env` excludes.
      schema:
        type: array
        items:
          type: string
      explode: true
    FacetUser:
      name: user
      in: query
      description: Only events of these users (Sentry user email, username, id or IP; Inspector user). Repeatable; `not.user` excludes.
      schema:
        type: array
        items:
          type: string
      explode: true
    FacetTrace:
      name: trace
      in: query
      description: Only events of these traces. Monolog `extra.trace_id` / `context.trace_id` (put there by a processor
        in the app); mails with an `X-Trace-Id`, `sentry-trace` or `traceparent` header; HTTP dumps with a `sentry-trace`
        or `traceparent` header (Sentry and OTel SDKs add it to outgoing calls). Repeatable; `not.trace` excludes.
      schema:
        type: array
        items:
          type: string
      explode: true
    Search:
      name: q
      in: query
      description: >-
        Full-text search: events whose indexed text contains every word of q, as a substring, case-insensitive
        (words shorter than 3 characters: case-insensitive for ASCII letters only)
        (Monolog: message, channel, keys and values of context and extra, first 4 KB). Quotes and other characters
        are literal. Types without indexed text never match.
      schema:
        type: string
    FacetChannel:
      name: channel
      in: query
      description: Only events of these channels (Monolog channel, Sentry logger). Repeatable; `not.channel` excludes.
      schema:
        type: array
        items:
          type: string
      explode: true
    FacetLevel:
      name: level
      in: query
      description: Only events of these levels (Monolog level name, Sentry level). Repeatable; `not.level` excludes.
      schema:
        type: array
        items:
          type: string
      explode: true
    FacetRelease:
      name: release
      in: query
      description: Only events of these releases (Sentry release). Repeatable; `not.release` excludes.
      schema:
        type: array
        items:
          type: string
      explode: true
    FacetTag:
      name: tag
      in: query
      description: 'Only events with these tags, each as `name:value` (Sentry and profiler tags). Values of one tag name
        are OR-ed, different names AND-ed; `not.tag` excludes.'
      schema:
        type: array
        items:
          type: string
      explode: true
    Window:
      name: window
      in: query
      description: Time window back from now (`15m`, `24h`, `7d`) when `from`/`to` are absent; `all` or `0` turns off `ui.default_window`.
      schema:
        type: string
    SentryProject:
      name: project
      in: path
      required: true
      description: DSN project segment
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Auth is on and the X-Auth-Token header is missing or invalid. Plain text body (`http.Error`).
      content:
        text/plain:
          schema:
            type: string
    StatusTrue:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                const: true
    SentryAccepted:
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                description: The event id (empty for envelopes without one)
  schemas:
    ExplainText:
      type: object
      properties:
        text:
          type: string
          maxLength: 4000
          description: The person's question; required for a follow-up.
    ExplainMessage:
      type: object
      required:
      - from
      - text
      - at
      properties:
        from:
          type: string
          enum: [you, agent]
        role:
          type: string
          description: The agent's post (agent messages).
        project:
          type: string
          description: The harnsy project (agent messages).
        text:
          type: string
        at:
          type: string
          format: date-time
    ExplainThread:
      type: object
      required:
      - event_uuid
      - project
      - conversation
      - messages
      properties:
        event_uuid:
          type: string
        project:
          type: string
        conversation:
          type: string
          description: The h2a conversation id.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ExplainMessage'
    CronSchedule:
      type: object
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - crontab
          - interval
        value:
          type: string
          description: Crontab (`0 3 * * *`, `@daily`) or the interval count (`10`).
        unit:
          type: string
          description: Interval unit.
          enum:
          - minute
          - hour
          - day
          - week
          - month
          - year
    CronMonitor:
      type: object
      properties:
        project:
          type: string
        slug:
          type: string
        source:
          type: string
          enum:
          - sentry
          - ping
          description: How its first check-in came.
        schedule:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CronSchedule'
        timezone:
          type: string
        checkin_margin:
          type: integer
          description: Minutes.
        max_runtime:
          type: integer
          description: Minutes.
        last_status:
          $ref: '#/components/schemas/CronStatus'
        last_checkin_at:
          type: string
          format: date-time
          nullable: true
        next_expected_at:
          type: string
          format: date-time
          nullable: true
          description: The next slot; null without a schedule.
        created_at:
          type: string
          format: date-time
        recent:
          type: array
          description: Last 20 runs, newest first.
          items:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/CronStatus'
              started_at:
                type: string
                format: date-time
    CronStatus:
      type: string
      description: in_progress, ok, error come from the job. The server writes missed (no check-in by slot + margin), timeout (in progress longer than max_runtime) and unknown (the slot fell while Buggregator was down). Empty for a monitor with no runs.
      enum:
      - ''
      - in_progress
      - ok
      - error
      - missed
      - timeout
      - unknown
    CronCheckIn:
      type: object
      properties:
        id:
          type: string
          description: check_in_id.
        status:
          $ref: '#/components/schemas/CronStatus'
        started_at:
          type: string
          format: date-time
          description: For missed and unknown, the slot.
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
        environment:
          type: string
        trace_id:
          type: string
          description: Links the run to errors, traces and logs of the same trace.
        source:
          type: string
          enum:
          - sentry
          - ping
        body:
          type: string
          description: Ping body tail, up to 10 KB.
        server_made:
          type: boolean
        expected_at:
          type: string
          format: date-time
          nullable: true
    SMTPRelayInfo:
      type: object
      required:
      - enabled
      - configured
      properties:
        enabled:
          type: boolean
          description: Release works now.
        configured:
          type: boolean
          description: A relay host is set.
        reason:
          type: string
          description: Why a configured relay is off.
        host:
          type: string
        port:
          type: integer
        tls:
          type: string
          enum:
          - starttls
          - tls
          - none
        auth:
          type: boolean
          description: A username is set; the password is never shown.
        from:
          type: string
          description: Envelope sender; empty means the message's own From.
        allowed_recipients:
          type: array
          items:
            type: string
        max_recipients:
          type: integer
        local_only:
          type: boolean
          description: Auth is off, so release works only from this machine (localhost).
    UserSettings:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          additionalProperties: true
          description: Key to the stored JSON value
    UpdateState:
      type: object
      description: Progress of an update; also the payload of the update.progress WebSocket event.
      properties:
        phase:
          type: string
          enum: [idle, downloading, verifying, installing, restarting, done, failed, rolled_back, restart_required]
        version:
          type: string
        previous:
          type: string
        failed_step:
          type: string
        bytes:
          type: integer
        total:
          type: integer
        error:
          type: string
        log:
          type: string
          description: Last start-up output of the new version (up to 8 KB) when rolled_back.
        updated_at:
          type: [string, "null"]
          format: date-time
    UpdateInfo:
      type: object
      properties:
        current:
          type: string
        latest:
          type: string
        available:
          type: boolean
        url:
          type: string
        notes:
          type: string
          description: Release notes (Markdown).
        checked_at:
          type: [string, "null"]
          format: date-time
        check_enabled:
          type: boolean
        mode:
          type: string
          enum: [self, manual, "off"]
        reason:
          type: string
        install:
          type: string
          enum: [binary, docker, kubernetes]
        os:
          type: string
        commands:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              command:
                type: string
        memory_db:
          type: boolean
          description: The database is in memory; a restart loses all events.
        restart_manual:
          type: boolean
          description: Windows; after the swap the state is restart_required.
        state:
          $ref: '#/components/schemas/UpdateState'
    Error:
      type: object
      required:
      - message
      - code
      properties:
        message:
          type: string
        code:
          type: integer
    Event:
      type: object
      required:
      - uuid
      - type
      - payload
      - timestamp
      - is_pinned
      properties:
        uuid:
          type: string
        type:
          type: string
          description: Event type (`sentry`, `smtp`, `monolog`, ...)
        payload:
          description: The event as the module stored it; its shape depends on `type`.
        timestamp:
          type: number
          description: Unix seconds with fraction
        project:
          type: string
          description: Project key; omitted for the default project in some events
        is_pinned:
          type: boolean
    EventPreview:
      type: object
      required:
      - uuid
      - type
      - payload
      - timestamp
      - searchable_text
      - is_pinned
      properties:
        uuid:
          type: string
        type:
          type: string
        payload:
          description: A reduced payload for lists; its shape depends on `type`.
        timestamp:
          type: number
        project:
          type: string
        searchable_text:
          type: string
        is_pinned:
          type: boolean
        facets:
          type: object
          description: 'Filterable values of the event by facet key, e.g. `{"host": ["web-1"], "tag:feature": ["checkout"]}`;
            absent when it has none.'
          additionalProperties:
            type: array
            items:
              type: string
    FacetCount:
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
        count:
          type: integer
    ListMeta:
      type: object
      required:
      - limit
      - offset
      - returned
      properties:
        limit:
          type: integer
          description: Applied limit; 0 = no limit
        offset:
          type: integer
        returned:
          type: integer
          description: Number of items in `data`
        from:
          type: number
          description: Applied lower bound (unix seconds), when set
        to:
          type: number
          description: Applied upper bound (unix seconds), when set
    Project:
      type: object
      required:
      - key
      - name
      - is_default
      properties:
        key:
          type: string
        name:
          type: string
        is_default:
          type: boolean
    Settings:
      type: object
      required:
      - auth
      - version
      - events
      properties:
        auth:
          type: object
          properties:
            enabled:
              type: boolean
            login_url:
              type: string
        version:
          type: string
        events:
          type: array
          description: Enabled event types
          items:
            type: string
        update:
          description: New-version check; null when the check is off
          oneOf:
          - type: 'null'
          - type: object
            properties:
              current:
                type: string
              latest:
                type: string
              url:
                type: string
              available:
                type: boolean
              checked_at:
                type: string
                format: date-time
    Metrics:
      type: object
      properties:
        events:
          type: object
          properties:
            received:
              type: object
              additionalProperties:
                type: number
            stored:
              type: object
              additionalProperties:
                type: number
            errors:
              type: number
        connections:
          type: object
          properties:
            websocket:
              type: number
            tcp:
              type: object
              additionalProperties:
                type: number
        http:
          type: object
          properties:
            requests_total:
              type: number
        webhooks:
          type: object
          properties:
            sent:
              type: number
            failed:
              type: number
    SentryQueueJob:
      type: object
      description: A queue job; fields of its last attempt unless said otherwise.
      required:
      - id
      - message_id
      - job
      - queue
      - connection
      - status
      - failed
      - attempts
      - failed_attempts
      - retried
      - duration_ms
      - latency_ms
      - started_at
      - finished_at
      - trace_id
      - transaction_id
      - project
      properties:
        id:
          type: string
          description: '`message_id`, or the transaction id when the attempt has none.'
        message_id:
          type: string
          nullable: true
        job:
          type: string
          description: Job class.
        queue:
          type: string
        connection:
          type: string
        status:
          type: string
          description: Sentry span status of the last attempt (`ok`, `internal_error`, …).
        failed:
          type: boolean
        attempts:
          type: integer
        failed_attempts:
          type: integer
        retried:
          type: boolean
        duration_ms:
          type: integer
          nullable: true
        latency_ms:
          type: integer
          nullable: true
          description: Time the attempt waited in the queue (sentry-laravel sends seconds, stored as ms).
        started_at:
          type: string
          nullable: true
          description: Start of the first attempt, ISO.
        finished_at:
          type: string
          nullable: true
          description: End of the last attempt, ISO.
        trace_id:
          type: string
        transaction_id:
          type: string
        project:
          type: string
    SentryQueueJobDetail:
      allOf:
      - $ref: '#/components/schemas/SentryQueueJob'
      - type: object
        required:
        - attempt_list
        - dispatched_by
        properties:
          attempt_list:
            type: array
            description: Attempts by start time.
            items:
              type: object
              required:
              - transaction_id
              - trace_id
              - attempt
              - status
              - failed
              - duration_ms
              - latency_ms
              - started_at
              - finished_at
              - gap_ms
              - errors
              properties:
                transaction_id:
                  type: string
                trace_id:
                  type: string
                attempt:
                  type: integer
                  description: messaging.message.retry.count + 1.
                status:
                  type: string
                failed:
                  type: boolean
                duration_ms:
                  type: integer
                  nullable: true
                latency_ms:
                  type: integer
                  nullable: true
                started_at:
                  type: string
                  nullable: true
                finished_at:
                  type: string
                  nullable: true
                gap_ms:
                  type: integer
                  nullable: true
                  description: Pause since the previous attempt ended.
                errors:
                  type: array
                  description: Error events of the attempt's trace captured while it ran.
                  items:
                    type: object
                    required:
                    - id
                    - exception_type
                    - exception_value
                    - event_ts
                    properties:
                      id:
                        type: string
                        description: Sentry event id.
                      exception_type:
                        type: string
                      exception_value:
                        type: string
                      event_ts:
                        type: string
          dispatched_by:
            type: object
            nullable: true
            description: The transaction whose queue.publish span has this message id.
            required:
            - transaction_id
            - trace_id
            - transaction_name
            - start_ts
            properties:
              transaction_id:
                type: string
              trace_id:
                type: string
              transaction_name:
                type: string
              start_ts:
                type: string
                nullable: true
    SentryQueueSummary:
      type: object
      required:
      - jobs
      - failed
      - retried
      - attempts
      - avg_duration_ms
      - queues
      properties:
        jobs:
          type: integer
        failed:
          type: integer
          description: Jobs whose last attempt failed.
        retried:
          type: integer
          description: Jobs with more than one attempt.
        attempts:
          type: integer
        avg_duration_ms:
          type: number
          nullable: true
          description: Mean attempt duration, one decimal.
        queues:
          type: array
          items:
            type: object
            required:
            - queue
            - jobs
            - failed
            properties:
              queue:
                type: string
              jobs:
                type: integer
              failed:
                type: integer
    SentryListMeta:
      type: object
      description: Pagination info.
      required:
      - total
      - page
      - limit
      properties:
        total:
          type: integer
          description: Total rows matching the filters.
        page:
          type: integer
          description: Current page, starting at 1.
        limit:
          type: integer
          description: Page size used.
    SentryExceptionList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/SentryExceptionEvent'
            - $ref: '#/components/schemas/SentryExceptionGroup'
        meta:
          $ref: '#/components/schemas/SentryListMeta'
    SentryExceptionEvent:
      type: object
      description: One error event in the chronological list.
      required:
      - id
      - event_id
      - fingerprint
      - occurrence_count
      - exception_type
      - exception_value
      - level
      - handled
      - transaction
      - received_at
      - trace_id
      properties:
        id:
          type: string
          description: Internal error event id.
        event_id:
          type: string
          description: Sentry event id.
        fingerprint:
          type: string
          description: Grouping fingerprint.
        occurrence_count:
          type: integer
          description: Events with the same fingerprint in the whole database (filters are not applied).
        exception_type:
          type: string
          description: Type of the first exception; empty when none.
        exception_value:
          type: string
          description: Message of the first exception; empty when none.
        level:
          type: string
        handled:
          type:
          - boolean
          - 'null'
        transaction:
          type: string
          description: Transaction name; empty when none.
        received_at:
          type: string
          description: Receive time, ISO UTC like `2026-09-04T05:33:12Z`.
        trace_id:
          type: string
          description: Trace id; empty when none.
    SentryExceptionGroup:
      type: object
      description: Error events grouped by fingerprint.
      required:
      - fingerprint
      - exception_type
      - exception_value
      - count
      - first_seen
      - last_seen
      - level
      - handled
      - sample_event_id
      properties:
        fingerprint:
          type: string
        exception_type:
          type: string
          description: Type of the first exception of the sample event; empty when none.
        exception_value:
          type: string
          description: Message of the first exception of the sample event; empty when none.
        count:
          type: integer
          description: Events in the group.
        first_seen:
          type: string
          description: Earliest receive time, ISO UTC.
        last_seen:
          type: string
          description: Latest receive time, ISO UTC.
        level:
          type: string
          description: Highest level by string order (SQL MAX).
        handled:
          type:
          - boolean
          - 'null'
          description: False if any event in the group is unhandled.
        sample_event_id:
          type: string
          description: Sentry event id of one event in the group.
    SentryExceptionDetail:
      type: object
      required:
      - id
      - event_id
      - fingerprint
      - level
      - handled
      - platform
      - environment
      - server_name
      - transaction
      - release
      - trace_id
      - span_id
      - received_at
      - event_ts
      - exceptions
      - breadcrumbs
      - trace_summary
      - payload
      properties:
        id:
          type: string
          description: Internal error event id.
        event_id:
          type: string
          description: Sentry event id.
        fingerprint:
          type: string
        level:
          type: string
        handled:
          type:
          - boolean
          - 'null'
        platform:
          type: string
          description: Empty when unknown.
        environment:
          type: string
          description: Empty when unknown.
        server_name:
          type: string
          description: Empty when unknown.
        transaction:
          type: string
          description: Empty when unknown.
        release:
          type: string
          description: Empty when unknown.
        trace_id:
          type: string
          description: Empty when unknown.
        span_id:
          type: string
          description: Empty when unknown.
        received_at:
          type: string
          description: Receive time, ISO UTC.
        event_ts:
          type: string
          description: Event timestamp as stored; empty when unknown.
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/SentryExceptionEntry'
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/SentryBreadcrumb'
        trace_summary:
          description: Summary of the event's trace; null when the event has no trace id or the trace has no transaction.
          oneOf:
          - $ref: '#/components/schemas/SentryTraceSummary'
          - type: 'null'
        payload:
          description: The original Sentry event JSON as stored; null when empty.
    SentryExceptionEntry:
      type: object
      description: One exception in the event's exception chain.
      required:
      - position
      - exception_type
      - exception_value
      - mechanism_type
      - handled
      - stacktrace
      properties:
        position:
          type: integer
          description: Order in the chain, 0 first.
        exception_type:
          type: string
        exception_value:
          type: string
        mechanism_type:
          type: string
          description: Empty when unknown.
        handled:
          type:
          - boolean
          - 'null'
        stacktrace:
          description: Stored Sentry stacktrace JSON, passed through as is; null when absent.
    SentryBreadcrumb:
      type: object
      required:
      - type
      - category
      - level
      - message
      - timestamp
      - data
      properties:
        type:
          type: string
        category:
          type: string
        level:
          type: string
        message:
          type: string
        timestamp:
          type: string
          description: Breadcrumb timestamp as stored.
        data:
          description: Breadcrumb data JSON as stored; null when absent.
    SentryTraceSummary:
      type: object
      required:
      - trace_id
      - transaction_name
      - op
      - duration_ms
      - span_count
      - preview_spans
      properties:
        trace_id:
          type: string
        transaction_name:
          type: string
          description: Name of the earliest transaction of the trace.
        op:
          type: string
        duration_ms:
          type:
          - integer
          - 'null'
        span_count:
          type: integer
          description: Spans in the trace.
        preview_spans:
          type: array
          description: Up to 3 longest spans.
          items:
            $ref: '#/components/schemas/SentryPreviewSpan'
    SentryPreviewSpan:
      type: object
      required:
      - span_id
      - op
      - description
      - start_offset_ms
      - duration_ms
      - is_error
      - peer_type
      properties:
        span_id:
          type: string
        op:
          type: string
        description:
          type: string
        start_offset_ms:
          type: integer
          description: Span start minus transaction start, in ms; 0 when unknown.
        duration_ms:
          type:
          - integer
          - 'null'
        is_error:
          type: boolean
        peer_type:
          type: string
          description: Peer kind like `db`, `cache`, `queue`; empty when none.
    SentryTraceList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SentryTraceListItem'
        meta:
          $ref: '#/components/schemas/SentryListMeta'
    SentryTraceListItem:
      type: object
      required:
      - trace_id
      - transaction_id
      - transaction_name
      - op
      - status
      - duration_ms
      - span_count
      - error_count
      - received_at
      - preview_spans
      properties:
        trace_id:
          type: string
        transaction_id:
          type: string
          description: Internal transaction id.
        transaction_name:
          type: string
        op:
          type: string
        status:
          type: string
        duration_ms:
          type:
          - integer
          - 'null'
        span_count:
          type: integer
          description: Spans in the whole trace.
        error_count:
          type: integer
          description: Error spans in the whole trace.
        received_at:
          type: string
          description: Transaction start time (start_ts), ISO.
        preview_spans:
          type: array
          description: Up to 3 longest spans.
          items:
            $ref: '#/components/schemas/SentryPreviewSpan'
    SentryTraceDetail:
      type: object
      required:
      - trace_id
      - transaction
      - spans
      - related_errors
      - related_log_count
      - n_plus_one
      properties:
        trace_id:
          type: string
        transaction:
          $ref: '#/components/schemas/SentryTransaction'
        spans:
          type: array
          description: All spans of the trace, by start time.
          items:
            $ref: '#/components/schemas/SentrySpan'
        related_errors:
          type: array
          description: Error events with this trace id, newest first.
          items:
            $ref: '#/components/schemas/SentryRelatedError'
        related_log_count:
          type: integer
          description: Logs with this trace id.
        n_plus_one:
          type: array
          description: >-
            Repeated database queries (N+1): database spans of one transaction
            whose query, with literals, placeholders and IN/VALUES lists
            normalized to ?, runs at least 5 times. Most repeated first.
          items:
            $ref: '#/components/schemas/SentryNPlusOne'
    SentryNPlusOne:
      type: object
      required:
      - transaction_id
      - query
      - count
      - total_ms
      - origin
      - span_ids
      properties:
        transaction_id:
          type: string
          nullable: true
        query:
          type: string
          description: The normalized query.
        count:
          type: integer
        total_ms:
          type: number
          description: Sum of the spans' durations in ms, two decimals (from span start and end times).
        origin:
          type: string
          nullable: true
          description: >-
            code.filepath:code.lineno of the first span that has it.
            sentry-laravel sends it only for queries slower than
            SENTRY_TRACE_SQL_ORIGIN_THRESHOLD_MS (100 ms by default), and
            only when app code is within the first 20 stack frames of the
            query (lazy-loaded Eloquent relations are usually deeper).
        span_ids:
          type: array
          items:
            type: string
    SentryTransaction:
      type: object
      description: The earliest transaction of the trace.
      required:
      - id
      - transaction_name
      - op
      - status
      - start_ts
      - end_ts
      - duration_ms
      properties:
        id:
          type: string
        transaction_name:
          type: string
        op:
          type: string
        status:
          type: string
        start_ts:
          type: string
          description: Start time, ISO; empty when unknown.
        end_ts:
          type: string
          description: End time, ISO; empty when unknown.
        duration_ms:
          type:
          - integer
          - 'null'
    SentrySpan:
      type: object
      required:
      - span_id
      - parent_span_id
      - op
      - description
      - status
      - start_offset_ms
      - duration_ms
      - peer_type
      - peer_address
      - is_error
      properties:
        span_id:
          type: string
        parent_span_id:
          type: string
          description: Empty for a root span.
        op:
          type: string
        description:
          type: string
        status:
          type: string
        start_offset_ms:
          type: integer
          description: Span start minus transaction start, in ms; 0 when unknown.
        duration_ms:
          type:
          - integer
          - 'null'
        peer_type:
          type: string
        peer_address:
          type: string
        is_error:
          type: boolean
    SentryRelatedError:
      type: object
      required:
      - id
      - exception_type
      - received_at
      properties:
        id:
          type: string
          description: Sentry event id of the error (not the internal id).
        exception_type:
          type: string
        received_at:
          type: string
          description: Receive time, ISO UTC.
    SentryFeedbackList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SentryFeedback'
        meta:
          $ref: '#/components/schemas/SentryListMeta'
    SentryFeedback:
      type: object
      required:
      - id
      - project
      - event_id
      - feedback_id
      - name
      - email
      - message
      - url
      - source
      - received_at
      - payload
      properties:
        id:
          type: string
        project:
          type: string
        event_id:
          type: string
          description: The error the feedback is about, as the SDK sent it. Empty when none.
        feedback_id:
          type: string
          description: The feedback event's own id. Empty for `user_report`.
        name:
          type: string
        email:
          type: string
        message:
          type: string
        url:
          type: string
          description: The page the feedback was sent from. Empty when the SDK did not send one.
        source:
          type: string
          enum:
          - feedback
          - user_report
        received_at:
          type: string
          format: date-time
        payload:
          description: The item as the SDK sent it.
          type:
          - object
          - 'null'
    SentryLogList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SentryLog'
        meta:
          $ref: '#/components/schemas/SentryListMeta'
    SentryLog:
      type: object
      required:
      - id
      - level
      - severity_number
      - body
      - trace_id
      - span_id
      - log_ts
      - attributes
      - trace_exists
      properties:
        id:
          type: string
        level:
          type: string
        severity_number:
          type:
          - integer
          - 'null'
        body:
          type: string
        trace_id:
          type: string
          description: Empty when none.
        span_id:
          type: string
          description: Empty when none.
        log_ts:
          type: string
          description: Log time, ISO; empty when unknown.
        attributes:
          description: Log attributes JSON as stored; null when absent.
        trace_exists:
          type: boolean
          description: True when the referenced trace is stored.
    SentryMetricList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SentryMetric'
        meta:
          $ref: '#/components/schemas/SentryListMeta'
    SentryMetric:
      type: object
      required:
      - id
      - name
      - type
      - value
      - unit
      - trace_id
      - span_id
      - metric_ts
      - attributes
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          description: Metric type, for example `counter`, `gauge`, `distribution`.
        value:
          type: number
        unit:
          type: string
          description: Empty when none.
        trace_id:
          type: string
          description: Empty when none.
        span_id:
          type: string
          description: Empty when none.
        metric_ts:
          type: string
          description: Metric time, ISO; empty when unknown.
        attributes:
          description: Metric attributes JSON as stored; null when absent.
    SentryServiceMap:
      type: object
      required:
      - from
      - to
      - bucket_seconds
      - window_minutes
      - nodes
      - edges
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        bucket_seconds:
          type: integer
          description: Step of every `buckets` list; at most 61 buckets.
        window_minutes:
          type: integer
          description: Length of the period in minutes.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/SentryServiceNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/SentryServiceEdge'
    SentryGraphBucket:
      type: object
      required:
      - t
      - count
      - errors
      properties:
        t:
          type: string
          format: date-time
          description: Bucket start.
        count:
          type: integer
        errors:
          type: integer
    SentryServiceNode:
      type: object
      required:
      - id
      - label
      - kind
      - request_count
      - error_count
      - error_rate
      - rpm
      - avg_duration_ms
      - p95_duration_ms
      - buckets
      properties:
        id:
          type: string
          description: Service name or peer address.
        label:
          type: string
          description: Display label, prefixed `DB:`, `Cache:` or `Queue:` for such peers.
        kind:
          type: string
          enum:
          - service
          - external
        request_count:
          type: integer
        error_count:
          type: integer
        error_rate:
          type: number
          description: error_count / request_count, 0..1.
        rpm:
          type: number
          description: Requests per minute over the period.
        avg_duration_ms:
          type:
          - integer
          - 'null'
        p95_duration_ms:
          type:
          - integer
          - 'null'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/SentryGraphBucket'
    SentryServiceEdge:
      type: object
      required:
      - source
      - target
      - op_type
      - trace_count
      - traces
      - request_count
      - error_count
      - error_rate
      - rpm
      - avg_duration_ms
      - p95_duration_ms
      - buckets
      properties:
        source:
          type: string
          description: Calling service name, `unknown` when not set.
        target:
          type: string
          description: The service that received the call, else the peer address.
        op_type:
          type: string
          description: Peer type of the spans.
        trace_count:
          type: integer
        traces:
          type: array
          description: Up to 20, errors first, then newest; the rest via /api/sentry/service-map/edge.
          items:
            $ref: '#/components/schemas/SentryEdgeTrace'
        request_count:
          type: integer
        error_count:
          type: integer
        error_rate:
          type: number
          description: error_count / request_count, 0..1.
        rpm:
          type: number
          description: Requests per minute over the period.
        avg_duration_ms:
          type:
          - integer
          - 'null'
        p95_duration_ms:
          type:
          - integer
          - 'null'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/SentryGraphBucket'
    SentryEdgeTrace:
      type: object
      required:
      - trace_id
      - start_ts
      - duration_ms
      - is_error
      properties:
        trace_id:
          type: string
        start_ts:
          type: string
          format: date-time
        duration_ms:
          type: integer
          description: Longest call of the edge in this trace.
        is_error:
          type: boolean
    SentryTraceSequence:
      type: object
      required:
      - trace_id
      - services
      - calls
      properties:
        trace_id:
          type: string
        services:
          type: array
          description: In order of first activity.
          items:
            type: string
        calls:
          type: array
          items:
            type: object
            required:
            - span_id
            - from
            - to
            - op_type
            - description
            - start_ts
            - end_ts
            - duration_ms
            - is_error
            - status
            - callee
            - late_ms
            properties:
              span_id:
                type: string
              from:
                type: string
              to:
                type: string
                description: Callee service, else the peer address.
              op_type:
                type: string
              description:
                type: string
              start_ts:
                type: string
                format: date-time
              end_ts:
                type: string
                format: date-time
              duration_ms:
                type:
                - integer
                - 'null'
              is_error:
                type: boolean
              status:
                type: string
              callee:
                description: The receiving service's own span; null for external calls.
                type:
                - object
                - 'null'
                properties:
                  service:
                    type: string
                  start_ts:
                    type: string
                    format: date-time
                  end_ts:
                    type: string
                    format: date-time
                  duration_ms:
                    type:
                    - integer
                    - 'null'
                  is_error:
                    type: boolean
                  transaction_id:
                    type:
                    - string
                    - 'null'
              late_ms:
                type:
                - integer
                - 'null'
                description: Callee end minus call end; above 0 the callee was still working after the caller stopped
                  waiting.
    SentryCounts:
      type: object
      required:
      - exceptions
      - traces
      - logs
      - metrics
      - feedback
      properties:
        exceptions:
          type: integer
          description: Error events.
        traces:
          type: integer
          description: Transactions.
        logs:
          type: integer
        metrics:
          type: integer
        feedback:
          type: integer
          description: User feedback, counted by the time it arrived.
    SentryStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: boolean
          const: true
    SmtpCursor:
      type: object
      required:
      - cursor
      properties:
        cursor:
          type: string
          description: Current server time, UTC, RFC 3339 with nanoseconds.
    SmtpStats:
      type: object
      required:
      - count
      - last_received_at
      properties:
        count:
          type: integer
          description: Number of SMTP messages.
        last_received_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Time of the newest message, UTC, RFC 3339. Null when there are none.
    SmtpStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: boolean
          const: true
    SmtpEmailAddress:
      type: object
      required:
      - email
      - name
      properties:
        email:
          type: string
        name:
          type: string
    SmtpParsedEmail:
      type: object
      description: Payload of an SMTP event.
      properties:
        id:
          type:
          - string
          - 'null'
          description: Message-ID header, or null.
        subject:
          type: string
        from:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SmtpEmailAddress'
        to:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SmtpEmailAddress'
        cc:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SmtpEmailAddress'
        bcc:
          type:
          - array
          - 'null'
          items:
            type: string
        reply_to:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SmtpEmailAddress'
        text:
          type: string
          description: Plain text body.
        html:
          type: string
          description: HTML body.
        raw:
          type: string
          description: Original RFC 822 source.
        parts:
          type: array
          description: Other body parts in message order (Apple Watch `text/watch-html`, AMP `text/x-amp-html`, `text/calendar`,
            delivery reports, other `text/*`). Omitted when there are none. HTML-like parts are untrusted HTML; AMP scripts
            are not meant to run.
          items:
            type: object
            required:
            - type
            - label
            - content
            - size
            properties:
              type:
                type: string
                description: Media type
              label:
                type: string
                description: Short name for a tab (`Apple Watch`, `AMP`, `Calendar`, `Delivery status`, `Read receipt`,
                  `Original headers`…; else the media type)
              content:
                type: string
                description: Decoded text, UTF-8, at most 1 MB
              size:
                type: integer
                description: Decoded size in bytes before truncation
              truncated:
                type: boolean
                description: Content was cut at 1 MB (the whole message is in `raw`)
        calendar:
          $ref: '#/components/schemas/SmtpCalendarInvite'
    SmtpCalendarInvite:
      type: object
      description: First event of a `text/calendar` part, else of an `.ics` attachment. Omitted when there is none. Times
        are RFC 3339 when the zone is known (UTC or an IANA TZID); otherwise local `2006-01-02T15:04:05` with `tz` naming
        the zone (e.g. Outlook's `W. Europe Standard Time`); a date `2006-01-02` for all-day events.
      required:
      - summary
      properties:
        method:
          type: string
          description: REQUEST, CANCEL, REPLY, PUBLISH…
        summary:
          type: string
        start:
          type: string
        end:
          type: string
        tz:
          type: string
        all_day:
          type: boolean
        location:
          type: string
        description:
          type: string
          description: At most 4000 characters
        url:
          type: string
        status:
          type: string
          description: CONFIRMED, TENTATIVE, CANCELLED
        uid:
          type: string
        sequence:
          type: string
        rrule:
          type: string
          description: Recurrence rule as sent (e.g. `FREQ=WEEKLY;BYDAY=MO`)
        organizer:
          $ref: '#/components/schemas/SmtpCalendarPerson'
        attendees:
          type: array
          description: At most 200
          items:
            allOf:
            - $ref: '#/components/schemas/SmtpCalendarPerson'
            - type: object
              properties:
                status:
                  type: string
                  description: NEEDS-ACTION, ACCEPTED, DECLINED, TENTATIVE
                role:
                  type: string
                  description: REQ-PARTICIPANT, OPT-PARTICIPANT, CHAIR
    SmtpCalendarPerson:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
    SmtpEvent:
      type: object
      description: A stored SMTP event.
      required:
      - uuid
      - type
      - payload
      - timestamp
      - is_pinned
      properties:
        uuid:
          type: string
        type:
          type: string
          const: smtp
        payload:
          $ref: '#/components/schemas/SmtpParsedEmail'
        timestamp:
          type: number
          description: Unix time in seconds (with fraction).
        project:
          type: string
          description: Project key. Omitted when empty.
        is_pinned:
          type: boolean
    SmtpMessageList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SmtpEvent'
        meta:
          type: object
          required:
          - total
          - limit
          - offset
          properties:
            total:
              type: integer
              description: Matches before offset and limit.
            limit:
              type: integer
              description: Applied limit; 0 means none.
            offset:
              type: integer
              description: Applied offset.
    SmtpLink:
      type: object
      required:
      - url
      - source
      properties:
        url:
          type: string
        text:
          type: string
          description: Link text with tags removed. Only for html links; omitted when empty.
        source:
          type: string
          enum:
          - html
          - text
          description: Body part the link came from.
    SmtpLinkList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SmtpLink'
    SmtpCodeList:
      type: object
      required:
      - data
      - pattern
      properties:
        data:
          type: array
          items:
            type: string
          description: Unique matches.
        pattern:
          type: string
          description: The regex that was used.
    MockRule:
      type: object
      required:
      - id
      - project
      - name
      - method
      - path
      - status
      - headers
      - body
      - delay_ms
      - template
      - seed
      - group
      - enabled
      - position
      - source
      - read_only
      properties:
        id:
          type: string
        project:
          type: string
          description: Project the rule applies to. Empty means every project.
        name:
          type: string
        method:
          type: string
          enum:
          - ANY
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
        path:
          type: string
          description: Path under /mock, e.g. /users/me, /users/{id}, /files/*.
        status:
          type: integer
          description: Response status, 100-599.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Response headers.
        body:
          type: string
          description: Response body.
        delay_ms:
          type: integer
          description: Delay before the answer, 0-30000 ms.
        template:
          type: boolean
          description: Body and header values are Go templates.
        seed:
          type: integer
          format: int64
          description: 'Not 0: template fake data is the same on every request.'
        group:
          type: string
          description: OpenAPI import group that made the rule. Empty means none.
        enabled:
          type: boolean
        position:
          type: integer
        source:
          type: string
          enum:
          - config
          - api
          - mcp
          description: config (buggregator.yaml, read-only), api (UI/REST) or mcp.
        read_only:
          type: boolean
        created_at:
          type: string
          format: date-time
          description: Omitted when empty.
        updated_at:
          type: string
          format: date-time
          description: Omitted when empty.
    MockRuleInput:
      type: object
      description: Body for creating or replacing a rule. `group` is stored on create and kept on replace. Other MockRule
        fields (id, position, source, read_only, created_at, updated_at) are ignored or overwritten. Body size limit 2 MB.
      required:
      - path
      properties:
        project:
          type: string
          description: Project the rule applies to. Empty means every project. Trimmed.
        name:
          type: string
          description: Trimmed.
        method:
          type: string
          description: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS or ANY (case-insensitive). Default ANY.
        path:
          type: string
          description: Must start with /. Supports {param} segments and a trailing *.
        status:
          type: integer
          default: 200
          description: 100-599. 0 or missing means 200.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Header names must not be blank or contain space, colon or newline.
        body:
          type: string
          description: At most 1 MB.
        delay_ms:
          type: integer
          minimum: 0
          maximum: 30000
          default: 0
        template:
          type: boolean
          description: Body and header values are Go templates. On update, missing keeps the old value.
        seed:
          type: integer
          format: int64
          description: 'Not 0: same fake data every time. On update, missing keeps the old value.'
        enabled:
          type: boolean
          default: true
          description: Missing means true.
    MockRuleList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MockRule'
    MockStatus:
      type: object
      required:
      - status
      properties:
        status:
          type: boolean
          const: true
    MockValidationError:
      type: object
      required:
      - message
      - code
      - errors
      properties:
        message:
          type: string
          description: 'e.g. invalid mock rule: path: must start with /'
        code:
          type: integer
          const: 422
        errors:
          type: object
          additionalProperties:
            type: string
          description: Invalid field name to message.
    MockOrderInput:
      type: object
      description: Body size limit 1 MB.
      properties:
        ids:
          type: array
          items:
            type: string
          description: Stored rule IDs in the wanted order. An unknown ID gives 404.
    MockDeleteGroupResult:
      type: object
      required:
      - deleted
      properties:
        deleted:
          type: integer
          description: Number of deleted rules.
    MockHelper:
      type: object
      required:
      - name
      - group
      - usage
      - description
      - example
      - result
      properties:
        name:
          type: string
        group:
          type: string
          enum:
          - request
          - data
          - output
          - fake
        usage:
          type: string
        description:
          type: string
        example:
          type: string
        result:
          type: string
    MockFakeParam:
      type: object
      required:
      - name
      - type
      - optional
      properties:
        name:
          type: string
        type:
          type: string
        optional:
          type: boolean
        default:
          type: string
          description: Omitted when empty.
        options:
          type: array
          items:
            type: string
          description: Omitted when empty.
    MockFake:
