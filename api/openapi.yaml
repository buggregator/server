      - name: context
        in: query
        required: false
        description: Context id (0 = locals). Non-negative integer; 400 otherwise.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: page
        in: query
        required: false
        description: Page of children for large arrays and objects (0-based). Non-negative integer; 400 otherwise.
        schema:
          type: integer
          minimum: 0
          default: 0
      security:
      - authToken: []
      responses:
        '200':
