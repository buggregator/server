      - Xdebug
      operationId: xdebugDetach
      summary: Detach and let the script run to its end (DBGp `detach`).
      description: 'Works only on a paused session driven here (`driver: here`), never while an IDE drives it. The body is
        not read. Write guard: the request must have `Content-Type: application/json` (415 `unsupported_media_type` otherwise),
        and a request with header `Sec-Fetch-Site: cross-site` is refused with 403 `cross_site`. Same-site and non-browser
        clients pass.'
      parameters:
      - name: id
        in: path
        required: true
        description: Xdebug session id (`id` from the session list).
        schema:
          type: string
      security:
      - authToken: []
      responses:
        '200':
          description: The session after the command was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugSession'
        '403':
          description: 'Cross-site request (`code: cross_site`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '404':
          description: 'No such session (`code: not_found`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '409':
          description: 'An IDE drives this session (`code: ide_attached`) or it is not paused (`code: not_paused`); both carry
