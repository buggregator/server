  /api/smtp/messages:
    get:
      tags:
      - SMTP
      operationId: smtpListMessages
      summary: List SMTP messages matching a filter
      description: All filters are optional and combined with AND. Filtering happens in memory; meta.total is the count after
        filtering, before offset and limit.
      security:
      - authToken: []
      parameters:
      - name: to
        in: query
        required: false
        description: 'Match a To address: case-insensitive substring of the email or the name.'
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: 'Match a From address: case-insensitive substring of the email or the name.'
        schema:
          type: string
      - name: cc
        in: query
        required: false
        description: 'Match a Cc address: case-insensitive substring of the email or the name.'
        schema:
          type: string
      - name: subject
        in: query
        required: false
        description: Exact subject (case-sensitive).
        schema:
          type: string
      - name: subject_contains
        in: query
        required: false
        description: Subject contains this text (case-sensitive).
        schema:
          type: string
      - name: subject_regex
        in: query
        required: false
        description: Subject matches this Go regular expression. An invalid regex matches nothing.
        schema:
          type: string
      - name: body_contains
        in: query
        required: false
        description: Text or HTML body contains this text (case-sensitive).
        schema:
          type: string
      - name: project
        in: query
        required: false
        description: Only messages of this project. Empty means all projects.
        schema:
          type: string
      - name: since
        in: query
        required: false
        description: Only messages received at or after this time. RFC 3339 string (e.g. a cursor), unix seconds (float),
          or unix milliseconds (values above 1e12). Unparsable means no limit.
        schema:
          type: string
      - name: until
        in: query
        required: false
        description: Only messages received at or before this time. Same formats as since.
        schema:
          type: string
      - name: order
        in: query
        required: false
        description: Sort order by time. Any value other than asc gives newest first.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: limit
        in: query
        required: false
        description: Max messages to return. Missing, invalid or not positive means no limit.
        schema:
          type: integer
          minimum: 1
      - name: offset
        in: query
        required: false
        description: Messages to skip after sorting. Invalid or negative means 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Matching messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpMessageList'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - SMTP
      operationId: smtpDeleteMessages
      summary: Delete all SMTP messages, optionally of one project
      security:
      - authToken: []
      parameters:
      - name: project
        in: query
        required: false
        description: Only delete messages of this project. Empty means all projects.
        schema:
          type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpStatus'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/smtp/messages/wait:
    get:
      tags:
      - SMTP
      operationId: smtpWaitMessage
      summary: Long-poll until an SMTP message matches the filter
      description: Takes the same filters as the list endpoint (order, limit and offset are ignored). If a stored message
        already matches, the newest match is returned at once. Otherwise the request is held open until a new matching message
        arrives or the timeout passes; then it answers 408. Use since (e.g. a cursor) to ignore older mail.
      security:
      - authToken: []
      parameters:
      - name: to
        in: query
        required: false
        description: 'Match a To address: case-insensitive substring of the email or the name.'
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: 'Match a From address: case-insensitive substring of the email or the name.'
        schema:
          type: string
      - name: cc
        in: query
        required: false
        description: 'Match a Cc address: case-insensitive substring of the email or the name.'
        schema:
          type: string
      - name: subject
        in: query
        required: false
        description: Exact subject (case-sensitive).
        schema:
          type: string
      - name: subject_contains
        in: query
        required: false
        description: Subject contains this text (case-sensitive).
        schema:
          type: string
      - name: subject_regex
        in: query
        required: false
        description: Subject matches this Go regular expression. An invalid regex matches nothing.
        schema:
          type: string
      - name: body_contains
        in: query
        required: false
        description: Text or HTML body contains this text (case-sensitive).
        schema:
          type: string
      - name: project
        in: query
        required: false
        description: Only messages of this project. Empty means all projects.
        schema:
          type: string
      - name: since
        in: query
        required: false
        description: Only messages received at or after this time. RFC 3339 string (e.g. a cursor), unix seconds (float),
          or unix milliseconds (values above 1e12). Unparsable means no limit.
        schema:
          type: string
      - name: until
        in: query
        required: false
        description: Only messages received at or before this time. Same formats as since.
        schema:
          type: string
      - name: timeout
        in: query
        required: false
        description: How long to wait, as a Go duration (e.g. 500ms, 10s, 1m). Default 30s, max 60s (longer values are cut
          to 60s). Invalid, zero or negative values use the default.
        schema:
          type: string
          default: 30s
          examples:
          - 10s
      responses:
        '200':
          description: The first matching message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpEvent'
        '408':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/smtp/relay:
    get:
      tags:
      - SMTP
      operationId: smtpGetRelay
      summary: Whether releasing a caught email to a real inbox is on, and where it goes
      description: Release is on when `smtp_relay.host` is set and, without auth, `smtp_relay.allowed_recipients` too; `reason` says why a configured relay is off. The password is never returned.
      security:
      - authToken: []
      responses:
        '200':
          description: Relay settings without secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMTPRelayInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/smtp/release/{uuid}:
    post:
      tags:
      - SMTP
      operationId: smtpReleaseMessage
      summary: Send a caught email to real mailboxes through the outgoing SMTP relay
      description: >-
        The message goes as captured (raw RFC 822); `rewrite_to` replaces its To header with the
        recipients and drops Cc. Only the Buggregator UI itself may call it (same origin; another
        page and the WebSocket RPC bridge are refused). Without auth only a request from this
        machine is taken (loopback peer and Host, no forwarding headers), and only when
        `smtp_relay.allowed_recipients` is set and every pattern has an exact domain (409 otherwise,
        so `*` or `*@*` keep release off): a proxy on the same host makes
        outside requests look local. Docker, another machine or a proxy need auth on. At most 10
        messages a minute and 20 recipients a message; recipients must match
        `smtp_relay.allowed_recipients` when set. The envelope sender is
        `smtp_relay.from`, else the login when it is an address, else the message's From.
      security:
      - authToken: []
      parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the SMTP event.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              properties:
                to:
                  type: array
                  description: Addresses; an item may also hold several, comma-separated.
                  items:
                    type: string
                rewrite_to:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Accepted by the relay.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - to
                properties:
                  status:
                    type: boolean
                  to:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /api/smtp/stats:
    get:
      tags:
      - SMTP
      operationId: smtpGetStats
      summary: Count SMTP messages and get the newest receive time
      security:
      - authToken: []
      parameters:
      - name: project
        in: query
        required: false
        description: Only messages of this project. Empty means all projects.
        schema:
          type: string
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpStats'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/update:
    get:
      tags:
      - Server
      operationId: getUpdate
      summary: Update from the UI — latest release, what this install allows, progress
      description: '`mode` self shows the button; manual gives `commands` to copy (Docker, Helm, read-only dir, open
        port without auth); off when the check is off, `update.self_update: off` or a dev build. `reason` says why
        and names the setting.'
      responses:
        '200':
          description: Update info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Server
      operationId: startUpdate
      summary: Install the latest release (binary installs, mode self)
      description: 'Downloads the asset of this platform, checks checksums.txt and its ed25519 signature, probes the new
        binary with --version, swaps it keeping the old one and restarts (Windows: restart by hand). Progress comes
        as `update.progress` on every `events.project.{key}` channel. JSON only; `Sec-Fetch-Site: cross-site` is
        refused.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
                version:
                  type: string
                  description: Must be the latest release.
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInfo'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /api/update/check:
    post:
      tags:
      - Server
      operationId: checkUpdate
      summary: Check GitHub for a new release now (at most once a minute)
      responses:
        '200':
          description: Update info after the check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Checked less than a minute ago
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: integer
                  retry_after:
                    type: integer
                    description: Seconds until the next check is allowed.
        '502':
          $ref: '#/components/responses/Error'
  /api/version:
    get:
      tags:
      - Server
      operationId: getVersion
      summary: Server version; also the health check
      security: []
      responses:
        '200':
          description: The running version
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                properties:
                  version:
                    type: string
                    examples:
                    - 2.10.0
  /api/xdebug:
    get:
      tags:
      - Xdebug
      operationId: xdebugGetStatus
      summary: Get Xdebug module status and settings.
      description: 'Returns the module config and the current session settings. When the Xdebug module is disabled, the server
        registers only this route and it returns the same shape with `enabled: false` and the values from the config, so the
        UI can show how to turn it on. All other /api/xdebug routes are then absent.'
      security:
      - authToken: []
      responses:
        '200':
          description: Module status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug-traces/{uuid}/search:
    get:
      tags:
      - Xdebug traces
      operationId: xdebugTraceSearch
      summary: Search calls in a trace.
      description: 'Finds calls whose function name or file contains `q` (case-insensitive), in trace order. Each match carries
        `path`, its callers from the top level down. 400 for a missing or too long `q`, bad numbers, a bad offset. 404 when
        the trace or its file is gone. 500 when the file cannot be read. A trace over the size limit is no error: 200 with
        `truncated: true`.'
      parameters:
      - name: uuid
        in: path
        required: true
        description: Xdebug trace event UUID.
        schema:
          type: string
      - name: q
        in: query
        required: true
        description: Search text, trimmed; 1-256 bytes.
        schema:
          type: string
          maxLength: 256
      - name: from
        in: query
        required: false
        description: Byte offset to resume the same list (the `next` of a previous page). Non-negative integer; 400 otherwise.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Max calls per page. Must be a positive integer (400 otherwise); values over 1000 are capped at 1000.
        schema:
          type: integer
          minimum: 1
          default: 200
      security:
      - authToken: []
      responses:
        '200':
          description: A page of matching calls, each with `path`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTracePage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '404':
          description: Trace or its file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '500':
          description: The trace file cannot be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug-traces/{uuid}/summary:
    get:
      tags:
      - Xdebug traces
      operationId: xdebugTraceGetSummary
      summary: Get a trace summary with its call index.
      description: 404 (`trace not found`) when the UUID is not an xdebug trace event.
      parameters:
      - name: uuid
        in: path
        required: true
        description: Xdebug trace event UUID.
        schema:
          type: string
      security:
      - authToken: []
      responses:
        '200':
          description: Trace file info and summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceSummaryResponse'
        '404':
          description: Trace or its file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug-traces/{uuid}/tree:
    get:
      tags:
      - Xdebug traces
      operationId: xdebugTraceGetTree
      summary: List one level of calls in a trace.
      description: 'Without `parent`: the top-level calls. With `parent`: the direct callees of the call whose entry starts
        at that offset (the page then has `parent`). Pass `from` = `next` with the same `parent` for the next page. 400 for
        bad numbers, an offset that is not the start of a call. 404 when the trace or its file is gone. 500 when the file
        cannot be read. A trace over the size limit is no error: 200 with `truncated: true`.'
      parameters:
      - name: uuid
        in: path
        required: true
        description: Xdebug trace event UUID.
        schema:
          type: string
      - name: parent
        in: query
        required: false
        description: Byte offset of a call (its `offset`). Non-negative integer; 400 otherwise.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: from
        in: query
        required: false
        description: Byte offset to resume the same list (the `next` of a previous page). Non-negative integer; 400 otherwise.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        required: false
        description: Max calls per page. Must be a positive integer (400 otherwise); values over 1000 are capped at 1000.
        schema:
          type: integer
          minimum: 1
          default: 200
      security:
      - authToken: []
      responses:
        '200':
          description: A page of calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTracePage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '404':
          description: Trace or its file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '500':
          description: The trace file cannot be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugTraceError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug/breakpoints:
    get:
      tags:
      - Xdebug
      operationId: xdebugListBreakpoints
      summary: List saved breakpoints.
      description: Saved breakpoints are sent to sessions driven here.
      security:
      - authToken: []
      responses:
        '200':
          description: Saved breakpoints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XdebugBreakpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Xdebug
      operationId: xdebugCreateBreakpoint
      summary: Save a new breakpoint.
      description: 'Creates a line breakpoint (`file` + `line` >= 1) or an exception breakpoint (`exception`). `enabled` defaults
        to true; `source` is set to `ui`. When `type` is left out it is `exception` if `exception` is set and `file` is not,
        else `line`. `file` must be an absolute path or a file:// URI; a path is turned into a file:// URI. A leading `\`
        is dropped from `exception`. A `condition` needs `xdebug.allow_eval`. Unknown fields are refused. Body limit 16 KiB.
        Write guard: the request must have `Content-Type: application/json` (415 `unsupported_media_type` otherwise), and
        a request with header `Sec-Fetch-Site: cross-site` is refused with 403 `cross_site`. Same-site and non-browser clients
        pass. A body over the size limit is 400, not 413.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XdebugBreakpointInput'
      security:
      - authToken: []
      responses:
        '201':
          description: The saved breakpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugBreakpoint'
        '400':
          description: 'Bad body, unknown field, or invalid breakpoint (`code: bad_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '403':
          description: 'Condition given while eval is off (`code: eval_disabled`), or cross-site request (`code: cross_site`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '415':
          description: 'Content-Type is not application/json (`code: unsupported_media_type`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug/breakpoints/{bp}:
    patch:
      tags:
      - Xdebug
      operationId: xdebugUpdateBreakpoint
      summary: Change a saved breakpoint.
      description: 'A field left out keeps its value. Same checks as create. Write guard: the request must have `Content-Type:
        application/json` (415 `unsupported_media_type` otherwise), and a request with header `Sec-Fetch-Site: cross-site`
        is refused with 403 `cross_site`. Same-site and non-browser clients pass. A body over the size limit is 400, not 413.'
      parameters:
      - name: bp
        in: path
        required: true
        description: Saved breakpoint id. A value that is not a positive integer gives 404.
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XdebugBreakpointInput'
      security:
      - authToken: []
      responses:
        '200':
          description: The updated breakpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugBreakpoint'
        '404':
          description: 'No such breakpoint (`code: not_found`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '400':
          description: 'Bad body, unknown field, or invalid breakpoint (`code: bad_request`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '403':
          description: 'Condition given while eval is off (`code: eval_disabled`), or cross-site request (`code: cross_site`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '415':
          description: 'Content-Type is not application/json (`code: unsupported_media_type`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Xdebug
      operationId: xdebugDeleteBreakpoint
      summary: Delete a saved breakpoint.
      description: 'A request with header `Sec-Fetch-Site: cross-site` is refused with 403 `cross_site`. No Content-Type check
        (there is no body).'
      parameters:
      - name: bp
        in: path
        required: true
        description: Saved breakpoint id. A value that is not a positive integer gives 404.
        schema:
          type: integer
          format: int64
          minimum: 1
      security:
      - authToken: []
      responses:
        '204':
          description: Deleted.
        '403':
          description: 'Cross-site request (`code: cross_site`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '404':
          description: 'No such breakpoint (`code: not_found`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug/files:
    get:
      tags:
      - Xdebug
      operationId: xdebugListFiles
      summary: Suggest files for a new breakpoint.
      description: Files seen in pauses and stacks (live and closed sessions) plus files of saved breakpoints, matched case-insensitively.
      parameters:
      - name: q
        in: query
        required: false
        description: Text to match. Prefix of the base name or path ranks first, then any substring. Empty lists all.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Max results, 1-200. Other or invalid values use the default.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      security:
      - authToken: []
      responses:
        '200':
          description: File URIs, best matches first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug/sessions:
    get:
      tags:
      - Xdebug
      operationId: xdebugListSessions
      summary: List Xdebug sessions.
      security:
      - authToken: []
      responses:
        '200':
          description: Live sessions and closed ones not yet dismissed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/XdebugSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug/sessions/{id}:
    get:
      tags:
      - Xdebug
      operationId: xdebugGetSession
      summary: Get one Xdebug session.
      parameters:
      - name: id
        in: path
        required: true
        description: Xdebug session id (`id` from the session list).
        schema:
          type: string
      security:
      - authToken: []
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugSession'
        '404':
          description: 'No such session (`code: not_found`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Xdebug
      operationId: xdebugDismissSession
      summary: Dismiss a closed Xdebug session.
      description: Removes a closed session from the list. A live session cannot be dismissed.
      parameters:
      - name: id
        in: path
        required: true
        description: Xdebug session id (`id` from the session list).
        schema:
          type: string
      security:
      - authToken: []
      responses:
        '204':
          description: Dismissed.
        '404':
          description: 'No such session (`code: not_found`).'
