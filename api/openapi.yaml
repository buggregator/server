        in: query
        description: Exact queue name (`messaging.destination.name`).
        schema:
          type: string
      - name: job
        in: query
        description: Exact job class (the transaction name, e.g. `App\\Jobs\\SendInvoice`).
        schema:
          type: string
      - name: from
        in: query
        description: Lower bound on the last attempt's end. Unix seconds or ISO, UTC.
        schema:
          type: string
      - name: to
        in: query
        description: Upper bound on the last attempt's end, same formats as `from`.
        schema:
          type: string
      - name: window
        in: query
        description: Period back from now, like `15m`, `24h`, `7d`. Used only when `from` and `to` are both absent.
        schema:
          type: string
      - name: status
        in: query
        description: '`ok` (last attempt ok), `failed` (last attempt failed), `retried` (more than one attempt).'
        schema:
          type: string
          enum:
          - ok
          - failed
          - retried
      - name: page
        in: query
        description: Page number, starting at 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Page size, 1..500. Out-of-range values fall back to the default.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      responses:
        '200':
          description: A page of jobs.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SentryQueueJob'
                  meta:
                    $ref: '#/components/schemas/SentryListMeta'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
