  /api/xdebug/sessions/{id}/breakpoints:
    get:
      tags:
      - Xdebug
      operationId: xdebugGetSessionBreakpoints
      summary: List breakpoints in a session.
      description: A session driven here answers from saved breakpoints at any time. A session an IDE drives asks Xdebug,
        so it works only while paused.
      parameters:
      - name: id
        in: path
        required: true
        description: Xdebug session id (`id` from the session list).
        schema:
          type: string
      security:
      - authToken: []
      responses:
        '200':
          description: 'For a session driven here (`driver: here`): the saved breakpoints with their state in this session.
            For a session an IDE drives: the breakpoints the IDE set.'
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/XdebugSessionBreakpoint'
                - type: array
                  items:
                    $ref: '#/components/schemas/XdebugIdeBreakpoint'
        '404':
          description: 'No such session (`code: not_found`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '409':
          description: 'The session is not paused (`code: not_paused`, with `state`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '422':
          description: 'Xdebug answered with a DBGp error (`code: xdebug_error`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '502':
          description: 'Talking to Xdebug failed (`code: xdebug_failed`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '504':
          description: 'Xdebug did not answer in time (`code: timeout`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XdebugError'
        '401':
          $ref: '#/components/responses/Unauthorized'
