openapi: 3.1.0
info:
  title: Buggregator HTTP API
  version: 2.10.0
  description: 'The HTTP API of the Buggregator server (v2): events, projects and the

    module APIs the web UI uses. It is the same API for scripts and tests,

    for example to wait for an email or to clear events between test runs.


    **Auth.** When auth is on (`auth.enabled`), routes marked with

    `authToken` need the header `X-Auth-Token: <jwt>`. The token is issued

    by the SSO login (`/auth/sso/login`). When auth is off (the default),

    no header is needed.


    **Ingestion.** SDKs send events to the same port. The paths below tagged

    `Ingestion` are matched by the event handlers, not by this API; any other

    path also accepts events marked with the `X-Buggregator-Event` header, a

    DSN user (`http://sentry@host:8000/1`) or Basic Auth `type:project`.


    **Health check.** `GET /api/version` is public, cheap and answers 200

    once the server is up.

    '
  license:
    name: MIT
    url: https://github.com/buggregator/server/blob/master/LICENSE
servers:
- url: http://127.0.0.1:8000
  description: Default local server
tags:
- name: Crons
  description: Scheduled job monitoring - Sentry check-ins and the ping URL
- name: Server
  description: Version, settings, health
- name: Events
  description: Stored events of every type
- name: Explain
  description: «Explain this error» - a Sentry error to the agents of a harnsy project over h2a, their answers back
- name: Projects
- name: Auth
- name: Metrics
- name: Sentry
- name: SMTP
- name: Attachments
- name: Mocks
- name: Xdebug
- name: Xdebug traces
- name: Profiler
- name: Ingestion
  description: Where SDKs send events (matched by the event handlers)
- name: Ray
  description: Ray pauses (ray()->pause())
paths:
  /api/audit:
    get:
      tags:
      - Auth
      operationId: listAudit
      summary: The audit log, newest first (only when auth is on)
      description: 'Sign-ins (`login`, `login_denied`), `logout`, `settings.update` and every non-GET call of a protected
        route (`events.clear`, `event.delete`, `sentry.clear`, `smtp.clear`, else the route pattern such as `POST /api/mocks`).
        A clear adds what it removed to `target` (`type=`, `project=`, `uuids=<count>`, `keep_pinned`). Kept 90 days.
        Only for `auth.admin_emails`; none set: every signed-in user sees every entry, with emails and IPs. `ip` is
        the TCP peer: behind a reverse proxy it is the proxy''s address. The route exists only when auth is on.'
      security:
      - authToken: []
      parameters:
      - name: limit
        in: query
        description: Page size; a larger value gives 500, a missing or non-positive one 100
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: before
        in: query
        description: Entries with a smaller id (`next_before` of the previous page)
        schema:
          type: integer
      responses:
        '200':
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        at:
                          type: string
                          description: UTC, `2006-01-02T15:04:05.000000Z`
                        user_id:
                          type: string
                        user:
                          type: string
                          description: Email (or name) of the user; `guest` when unknown
                        action:
                          type: string
                        target:
                          type: string
                          description: Request path and query of an API call
                        status:
                          type: integer
                          description: HTTP status of the answer
                        ip:
                          type: string
                          description: TCP peer of the request (a reverse proxy's address when behind one)
                  next_before:
                    type: integer
                    description: Pass as `before` for the next page; absent on an empty page
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not an admin
  /api/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Sign out, revoking the token's session on the server (only when auth is on)
      description: The token stops working at once for the API and the WebSocket; open sockets that connected with it
        are closed (code 3500). Other sessions of the same user stay. The route exists only when auth is on.
      security:
      - authToken: []
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/event/{uuid}:
    parameters:
    - $ref: '#/components/parameters/EventUUID'
    get:
      tags:
      - Events
      operationId: getEvent
      summary: Get one event
      security:
      - authToken: []
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Events
      operationId: deleteEvent
      summary: Delete one event
      security:
      - authToken: []
      responses:
        '200':
          $ref: '#/components/responses/StatusTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
  /api/event/{uuid}/pin:
    parameters:
    - $ref: '#/components/parameters/EventUUID'
    post:
      tags:
      - Events
      operationId: pinEvent
      summary: Pin an event (pinned events list first and survive keep_pinned clears)
      security:
      - authToken: []
      responses:
        '200':
          description: Pinned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: pinned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Events
      operationId: unpinEvent
      summary: Unpin an event
      security:
      - authToken: []
      responses:
        '200':
          description: Unpinned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: unpinned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
  /api/explain:
    get:
      tags:
      - Explain
      operationId: explainStatus
      summary: Whether «Explain this error» is connected to harnsy (only when explain.url and explain.token are set)
      security:
      - authToken: []
      responses:
        '200':
          description: Connection state
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - status
                - to
                properties:
                  enabled:
                    type: boolean
                  status:
                    type: string
                    enum: [connecting, connected, stopped]
                  reason:
                    type: string
                    description: Why stopped, or the last connection error.
                  project:
                    type: string
                    description: The harnsy project of the pass, when connected.
                  to:
                    type: string
                    description: The address explanations go to (lead or role:<id>).
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/explain/event/{uuid}:
    parameters:
    - $ref: '#/components/parameters/EventUUID'
    get:
      tags:
      - Explain
      operationId: getExplainThread
      summary: The conversation with the agents about this event (kept in memory)
      security:
      - authToken: []
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainThread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Explain
      operationId: explainEvent
      summary: Send a Sentry error to the harnsy agents and start a conversation
      description: Builds a plain-text description of the error (exception chain, app frames with source lines, tags, breadcrumbs,
        request method and URL; no headers or body) and sends it over h2a. Answers arrive as `explain.message` on the event's
        project channel.
      security:
      - authToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainText'
      responses:
        '200':
          description: Sent; the new thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainThread'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /api/explain/event/{uuid}/messages:
    parameters:
    - $ref: '#/components/parameters/EventUUID'
    post:
      tags:
      - Explain
      operationId: explainFollowUp
      summary: A follow-up question in the event's conversation
      security:
      - authToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainText'
      responses:
        '200':
          description: Sent; the thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainThread'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /api/events:
    get:
      tags:
      - Events
      operationId: listEvents
      summary: List stored events, newest first (pinned first)
      security:
      - authToken: []
      parameters:
      - $ref: '#/components/parameters/EventType'
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/FacetHost'
      - $ref: '#/components/parameters/FacetEnv'
      - $ref: '#/components/parameters/FacetUser'
      - $ref: '#/components/parameters/FacetChannel'
      - $ref: '#/components/parameters/FacetLevel'
      - $ref: '#/components/parameters/FacetRelease'
      - $ref: '#/components/parameters/FacetTag'
      - $ref: '#/components/parameters/FacetTrace'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Events and the limits that were applied
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Events
      operationId: clearEvents
      summary: Delete events (all, or by type, project or UUIDs)
      description: 'With no body, or an empty JSON object, deletes every event: use it to start each test from a clean state.

        With `uuids`, only those events are deleted (`keep_pinned` still applies); `type` and `project` are then ignored.
        Without `uuids`, `type`, `project` and `keep_pinned` combine.

        A body that is not valid JSON is refused with 400 and deletes nothing.'
      security:
      - authToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Only events of this type (`sentry`, `smtp`, `monolog`, ...)
                project:
                  type: string
                  description: Only events of this project
                uuids:
                  type: array
                  items:
                    type: string
                  description: Only these events
                keep_pinned:
                  type: boolean
                  description: Keep pinned events
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/StatusTrue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
  /api/events/facets:
    get:
      tags:
      - Events
      operationId: listEventFacets
      summary: Values events can be filtered by, with counts
      description: 'For each facet key (`host`, `env`, `user`, `channel`, `level`, `release`, `trace`, `tag:<name>`) its values
        with the number of events under the same type, project, window and filters as the feed, most frequent first,
        at most 50 per key. A key''s counts ignore the filter on that same key, so picking one host still lists the
        others.'
      security:
      - authToken: []
      parameters:
      - $ref: '#/components/parameters/EventType'
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/FacetHost'
      - $ref: '#/components/parameters/FacetEnv'
      - $ref: '#/components/parameters/FacetUser'
      - $ref: '#/components/parameters/FacetChannel'
      - $ref: '#/components/parameters/FacetLevel'
      - $ref: '#/components/parameters/FacetRelease'
      - $ref: '#/components/parameters/FacetTag'
      - $ref: '#/components/parameters/FacetTrace'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Facet values with counts
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - keys
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/FacetCount'
                  keys:
                    type: array
                    description: Facet keys present in `data`, sorted
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
  /api/events/histogram:
    get:
      tags:
      - Events
      operationId: eventsHistogram
      summary: Events per time bucket, split by level
      description: >-
        Counts the events matching the same type, project, window, filters and search as the feed per time bucket.
        Empty buckets are left out. A selection wider than 1440 buckets gets wider buckets: the reply's `bucket` is
        the width used.
      security:
      - authToken: []
      parameters:
      - name: bucket
        in: query
        description: Bucket width in seconds (default 60)
        schema:
          type: integer
          minimum: 1
          maximum: 31622400
      - $ref: '#/components/parameters/EventType'
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/FacetHost'
      - $ref: '#/components/parameters/FacetEnv'
      - $ref: '#/components/parameters/FacetUser'
      - $ref: '#/components/parameters/FacetChannel'
      - $ref: '#/components/parameters/FacetLevel'
      - $ref: '#/components/parameters/FacetRelease'
      - $ref: '#/components/parameters/FacetTag'
      - $ref: '#/components/parameters/FacetTrace'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Buckets, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                - bucket
                - data
                properties:
                  bucket:
                    type: integer
                    description: Bucket width used, seconds
                  data:
                    type: array
                    items:
                      type: object
                      required:
                      - t
                      - count
                      - levels
                      properties:
                        t:
                          type: integer
                          description: Bucket start, unix seconds
                        count:
                          type: integer
                          description: All events in the bucket, with or without a level
                        levels:
                          type: object
                          description: Events per level facet (lower case), e.g. {"error":2,"info":5}
                          additionalProperties:
                            type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/events/preview:
    get:
      tags:
      - Events
      operationId: listEventPreviews
      summary: List events as previews (smaller payloads, searchable text)
      security:
      - authToken: []
      parameters:
      - $ref: '#/components/parameters/EventType'
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/FacetHost'
      - $ref: '#/components/parameters/FacetEnv'
      - $ref: '#/components/parameters/FacetUser'
      - $ref: '#/components/parameters/FacetChannel'
      - $ref: '#/components/parameters/FacetLevel'
      - $ref: '#/components/parameters/FacetRelease'
      - $ref: '#/components/parameters/FacetTag'
      - $ref: '#/components/parameters/FacetTrace'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Previews and the limits that were applied
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventPreview'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
  /api/http-dump/attachments/{eventUuid}/preview/{uuid}:
    get:
      tags:
      - Attachments
      operationId: attachmentPreviewHttpDump
      summary: Show an attachment inline with its own MIME type
      description: 'Public: opened as a plain link without a token. Same as download, but Content-Type is the stored MIME
        type and there is no Content-Disposition. Reads http_dump_attachments (HTTP dump events).'
      security: []
      parameters:
      - name: eventUuid
        in: path
        required: true
        description: UUID of the event that owns the attachment.
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        description: UUID of the attachment.
        schema:
          type: string
      responses:
        '200':
          description: File content with the stored MIME type as Content-Type.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttachmentFile'
        '403':
          description: 'Attachment belongs to another event (body: forbidden).'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 'Attachment row or file not found (body: attachment not found / file not found).'
          content:
            text/plain:
              schema:
                type: string
  /api/http-dump/attachments/{eventUuid}/{uuid}:
    get:
      tags:
      - Attachments
      operationId: attachmentDownloadHttpDump
      summary: Download an attachment file
      description: 'Public: opened as a plain link without a token. Needs both the event and attachment UUIDs. Reads http_dump_attachments
        (HTTP dump events).'
      security: []
      parameters:
      - name: eventUuid
        in: path
        required: true
        description: UUID of the event that owns the attachment.
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        description: UUID of the attachment.
        schema:
          type: string
      responses:
        '200':
          description: File content. Content-Disposition is attachment with the stored file name.
          headers:
            Content-Disposition:
              description: attachment; filename="<name>"
              schema:
                type: string
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AttachmentFile'
        '403':
          description: 'Attachment belongs to another event (body: forbidden).'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 'Attachment row or file not found (body: attachment not found / file not found).'
          content:
            text/plain:
              schema:
                type: string
  /api/http-dump/attachments/{uuid}:
    get:
      tags:
      - Attachments
      operationId: attachmentListHttpDump
      summary: List attachments of an event
      description: Reads http_dump_attachments (HTTP dump events).
      security:
      - authToken: []
      parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the event.
        schema:
          type: string
      responses:
        '200':
          description: Attachments (empty list if none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentList'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/http-dumps/attachments/{eventUuid}/preview/{uuid}:
    get:
      tags:
      - Attachments
      operationId: attachmentPreviewHttpDumps
      summary: Show an attachment inline with its own MIME type
      description: 'Public: opened as a plain link without a token. Same as download, but Content-Type is the stored MIME
        type and there is no Content-Disposition. Reads http_dump_attachments (HTTP dump events; plural alias kept for old
        clients).'
      security: []
      parameters:
      - name: eventUuid
        in: path
        required: true
        description: UUID of the event that owns the attachment.
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        description: UUID of the attachment.
        schema:
          type: string
      responses:
        '200':
          description: File content with the stored MIME type as Content-Type.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AttachmentFile'
        '403':
          description: 'Attachment belongs to another event (body: forbidden).'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 'Attachment row or file not found (body: attachment not found / file not found).'
          content:
            text/plain:
              schema:
                type: string
  /api/http-dumps/attachments/{eventUuid}/{uuid}:
    get:
      tags:
      - Attachments
      operationId: attachmentDownloadHttpDumps
      summary: Download an attachment file
      description: 'Public: opened as a plain link without a token. Needs both the event and attachment UUIDs. Reads http_dump_attachments
        (HTTP dump events; plural alias kept for old clients).'
      security: []
      parameters:
      - name: eventUuid
        in: path
        required: true
        description: UUID of the event that owns the attachment.
        schema:
          type: string
      - name: uuid
        in: path
        required: true
        description: UUID of the attachment.
        schema:
          type: string
      responses:
        '200':
          description: File content. Content-Disposition is attachment with the stored file name.
          headers:
            Content-Disposition:
              description: attachment; filename="<name>"
              schema:
                type: string
            Content-Length:
              description: File size in bytes.
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AttachmentFile'
        '403':
          description: 'Attachment belongs to another event (body: forbidden).'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: 'Attachment row or file not found (body: attachment not found / file not found).'
          content:
            text/plain:
              schema:
                type: string
  /api/http-dumps/attachments/{uuid}:
    get:
      tags:
      - Attachments
      operationId: attachmentListHttpDumps
      summary: List attachments of an event
      description: Reads http_dump_attachments (HTTP dump events; plural alias kept for old clients).
      security:
      - authToken: []
      parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of the event.
        schema:
          type: string
      responses:
        '200':
          description: Attachments (empty list if none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentList'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me:
    get:
      tags:
      - Auth
      operationId: getMe
      summary: The signed-in user (only when auth is on)
      security:
      - authToken: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Id of the user on this server
                      provider:
                        type: string
                      username:
                        type: string
                        description: Display name (name, else login)
                      email:
                        type: string
                      avatar:
                        type: string
                      logout_url:
                        type: string
                        description: Always empty; sign out with POST /api/auth/logout
                      is_admin:
                        type: boolean
                        description: May read GET /api/audit
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: 'The route exists only when auth is on. With auth off the path is not an API route: the UI page answers
        it (200 text/html).'
  /api/me/settings:
    get:
      tags:
      - Auth
      operationId: getMySettings
      summary: The signed-in user's settings stored on the server (only when auth is on)
      description: Keys and JSON values the UI stored for this user; they follow the user to every browser. The route
        exists only when auth is on; with auth off the UI keeps its settings in the browser.
      security:
      - authToken: []
      responses:
        '200':
          description: All settings of the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Auth
      operationId: putMySettings
      summary: Merge settings of the signed-in user (only when auth is on)
      description: Keys in the body replace stored ones; a `null` value removes the key; other keys stay. At most 64
        keys per user, key 1-128 characters, value up to 16 KB of JSON.
      security:
      - authToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: All settings after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          description: Not a JSON object, a bad key, or more than 64 keys
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Body over 256 KB or a value over 16 KB
  /api/metrics:
