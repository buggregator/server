              schema:
                $ref: '#/components/schemas/XdebugError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/xdebug/sessions/{id}/agent-log:
    get:
      tags:
      - Xdebug
      operationId: xdebugGetAgentLog
