  /apps/{app_id}/events:
    post:
      tags:
      - Ingestion
      operationId: ingestBroadcastEvent
      summary: Pusher HTTP API event (Laravel Reverb, Pusher, soketi clients)
      description: Matched only when signed (`auth_key`, `auth_signature` in the query); a path prefix before `/apps/` is allowed.
        Each event is stored as a `broadcast` event with its channels, data and warnings. With `broadcast.upstream` set the
        request is also forwarded unchanged and the upstream's status and body are returned (502 when it cannot be reached);
        without it the answer is `{}`. The signature is checked only for app keys in `broadcast.apps`.
        The project is the `X-Buggregator-Project` header (no `X-Buggregator-Event` needed), else `default`.
      x-ingestion: true
      security: []
      parameters:
      - name: X-Buggregator-Project
        in: header
        required: false
        description: Project key for the stored events. Default `default`.
        schema:
          type: string
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                data:
                  type: string
                channel:
                  type: string
                channels:
                  type: array
                  items:
                    type: string
                socket_id:
                  type: string
      responses:
        '200':
          description: '`{}`, or the upstream''s answer when forwarding'
        '502':
          description: The upstream could not be reached; the event is stored anyway
  /apps/{app_id}/batch_events:
    post:
      tags:
      - Ingestion
      operationId: ingestBroadcastBatch
      summary: Pusher HTTP API batch (up to 10 events), one `broadcast` event each, sharing a `batch_id`
      x-ingestion: true
      security: []
      parameters:
      - name: X-Buggregator-Project
        in: header
        required: false
        description: Project key for the stored events. Default `default`.
        schema:
          type: string
      - name: app_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                batch:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: '`{}`, or the upstream''s answer when forwarding'
  /api/profiler/store:
    post:
      tags:
      - Ingestion
      operationId: ingestProfiler
      summary: XHProf profile from the Buggregator profiler client
      x-ingestion: true
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/StatusTrue'
  /api/profiler/{uuid}/call-graph:
    get:
      tags:
      - Profiler
      operationId: profilerGetCallGraph
      summary: Get the call graph of a profile.
      description: One node per unique callee. A node is dropped when its percent is below `percentage` and at or below `threshold`.
        Only edges between kept nodes are returned. Nodes and edges at or above `percentage` get a red shade; others are white.
      parameters:
      - name: uuid
        in: path
        required: true
        description: Profiler event UUID.
        schema:
          type: string
      - name: metric
        in: query
        required: false
        description: Metric for percents and cost. Unknown values act as `cpu`.
        schema:
          type: string
          enum:
          - cpu
          - wt
          - mu
          - pmu
          default: cpu
      - name: threshold
        in: query
        required: false
        description: Percent (0-100). Invalid values use the default.
        schema:
          type: number
          default: 0
      - name: percentage
        in: query
        required: false
        description: Percent (0-100) that marks a node as important. Invalid values use the default.
        schema:
          type: number
          default: 10
      security:
      - authToken: []
      responses:
        '200':
          description: Graph nodes and edges, plus toolbar metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilerCallGraph'
        '404':
          description: Loading the profile edges failed. Plain text body `not found`. An unknown UUID usually gives 200 with
            empty data instead.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/profiler/{uuid}/flame-chart:
    get:
      tags:
      - Profiler
      operationId: profilerGetFlameChart
      summary: Get the flame chart tree of a profile.
      description: Each function is expanded once, under the edge that reaches it at the smallest depth; other call sites
        are leaves. The tree is capped at 50000 nodes and depth 512.
      parameters:
      - name: uuid
        in: path
        required: true
        description: Profiler event UUID.
        schema:
          type: string
      - name: metric
        in: query
        required: false
        description: Metric for durations and colors. `duration` is the value / 1000 (time metrics) or / 1024 (mu, pmu).
        schema:
          type: string
          enum:
          - cpu
          - wt
          - mu
          - pmu
          - ct
          default: wt
      security:
      - authToken: []
      responses:
        '200':
          description: Root nodes of the flame chart.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfilerFlameNode'
        '404':
          description: Loading the profile edges failed. Plain text body `not found`. An unknown UUID usually gives 200 with
            empty data instead.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/profiler/compare:
    get:
      tags:
      - Profiler
      operationId: profilerCompare
      summary: Compare two profiles function by function.
      description: >-
        Every function of either profile with its exclusive wall time (µs), exclusive memory (bytes) and calls in both
        profiles and the change (compare − base). A function missing from one profile counts 0 there. Biggest
        wall-time change first, then memory, calls, name. `main()` is included: it carries the change of the whole run.
      parameters:
      - name: base
        in: query
        required: true
        description: Profiler event UUID of the "before" profile.
        schema:
          type: string
      - name: compare
        in: query
        required: true
        description: Profiler event UUID of the "after" profile.
        schema:
          type: string
      - name: limit
        in: query
        description: Functions to return, 1..1000 (larger values are capped).
        schema:
          type: integer
          minimum: 1
          default: 100
      security:
      - authToken: []
      responses:
        '200':
          description: Comparison.
          content:
            application/json:
              schema:
                type: object
                required:
                - functions
                - total
                - base_totals
                - compare_totals
                properties:
                  functions:
                    type: array
                    items:
                      type: object
                      required:
                      - function
                      - base_excl_wt
                      - compare_excl_wt
                      - diff_excl_wt
                      - base_excl_mu
                      - compare_excl_mu
                      - diff_excl_mu
                      - base_ct
                      - compare_ct
                      - diff_ct
                      properties:
                        function:
                          type: string
                        base_excl_wt:
                          type: integer
                        compare_excl_wt:
                          type: integer
                        diff_excl_wt:
                          type: integer
                        base_excl_mu:
                          type: integer
                        compare_excl_mu:
                          type: integer
                        diff_excl_mu:
                          type: integer
                        base_ct:
                          type: integer
                        compare_ct:
                          type: integer
                        diff_ct:
                          type: integer
                  total:
                    type: integer
                    description: Functions in both profiles together, before the limit.
                  base_totals:
                    $ref: '#/components/schemas/ProfilerCompareTotals'
                  compare_totals:
                    $ref: '#/components/schemas/ProfilerCompareTotals'
        '400':
          description: '`base` or `compare` missing, or a bad `limit`. Plain text.'
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No profile with that UUID. Plain text.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/profiler/{uuid}/summary:
    get:
      tags:
      - Profiler
      operationId: profilerGetSummary
      summary: Get profile totals and top functions.
      description: '`main()` is skipped when picking the slowest, memory-heaviest and most-called function.'
      parameters:
      - name: uuid
        in: path
        required: true
        description: Profiler event UUID.
        schema:
          type: string
      security:
      - authToken: []
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilerSummary'
        '404':
          description: Loading the profile edges failed. Plain text body `not found`. An unknown UUID usually gives 200 with
            empty data instead.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/profiler/{uuid}/top:
    get:
      tags:
      - Profiler
      operationId: profilerGetTopFunctions
      summary: Get top functions of a profile.
      parameters:
      - name: uuid
        in: path
        required: true
        description: Profiler event UUID.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Max functions, 10-300. Other or invalid values use the default.
        schema:
          type: integer
          minimum: 10
          maximum: 300
          default: 100
      - name: metric
        in: query
        required: false
        description: Sort key. Unknown values act as `cpu`.
        schema:
          type: string
          default: cpu
          enum:
          - cpu
          - wt
          - mu
          - pmu
          - ct
          - excl_cpu
          - excl_wt
          - excl_mu
          - excl_pmu
          - excl_ct
      - name: order
        in: query
        required: false
        description: Sort direction, applied to the whole profile before `limit`; `asc` gives the lowest N. Other values act
          as `desc`.
        schema:
          type: string
          default: desc
          enum:
          - desc
          - asc
      security:
      - authToken: []
      responses:
        '200':
          description: Function stats with table schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilerTopFunctions'
        '404':
          description: Loading the profile edges failed. Plain text body `not found`. An unknown UUID usually gives 200 with
            empty data instead.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      summary: List projects (configured ones and those created by events)
      security:
      - authToken: []
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Error'
  /api/ray/locks/{name}:
    post:
      tags:
      - Ray
      operationId: rayReleaseLock
      summary: Continue or stop a script paused by ray()->pause()
      description: >-
        The UI's Continue / Stop execution (also over WebSocket RPC as `post:api/ray/locks/{name}`). Releases the pause
        the client polls at `GET /locks/{name}`, writes `content.state` into the event's `create_lock` payload and
        re-broadcasts the event. A second call changes nothing and answers the state already set. Pauses live in
        memory: after a server restart the lock is unknown (404) and the script has already gone on.
      security:
      - authToken: []
      parameters:
      - name: name
        in: path
        required: true
        description: Lock name from the `create_lock` payload
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stop_execution:
                  type: boolean
                  description: true stops the script (StopExecutionRequested), false or absent continues it
      responses:
        '200':
          description: Pause released
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - state
                properties:
                  status:
                    type: boolean
                    const: true
                  state:
                    type: string
                    enum:
                    - continued
                    - stopped
                  warning:
                    type: string
                    description: The pause is released, but its state could not be saved into the event
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown lock (never created, expired or the server restarted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    const: false
                  error:
                    type: string
  /api/sentry/all:
    delete:
      tags:
      - Sentry
      operationId: sentryClearAll
      summary: Delete stored Sentry errors, traces, spans, logs and metrics.
      security:
      - authToken: []
      parameters:
      - name: project
        in: query
