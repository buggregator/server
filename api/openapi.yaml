      - children
      - done
      - offset
      properties:
        nr:
          type: integer
        func:
          type: string
        user:
          type: boolean
        include:
          type: string
        file:
          type: string
        line:
          type: integer
        level:
          type: integer
        start:
          type: number
        incl:
          type: number
        self:
          type: number
        memory:
          type: integer
          format: int64
          description: Memory change from entry to exit.
        args:
          type: array
          items:
            type: string
        return:
          type: string
        children:
          type: integer
          description: Number of direct callees.
        done:
          type: boolean
          description: Its exit was seen (false when the trace was cut).
        offset:
          type: integer
          format: int64
          description: Pass as parent= or from=.
        path:
          type: array
          description: 'Search results only: callers from the top level down.'
          items:
            type: object
            required:
            - nr
            - func
            - offset
            properties:
              nr:
                type: integer
              func:
                type: string
              offset:
                type: integer
                format: int64
    XdebugTracePage:
      type: object
      required:
      - nodes
      - next
      - truncated
      properties:
        parent:
          $ref: '#/components/schemas/XdebugTraceNode'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/XdebugTraceNode'
        next:
          type:
          - integer
          - 'null'
          format: int64
          description: Offset for from=; null when there is no more.
        truncated:
          type: boolean
          description: The trace was cut or hit the size limit.
    XdebugTraceError:
      type: object
      required:
      - error
      properties:
        error:
          type: string
