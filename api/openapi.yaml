        `queue_job_transactions` is on; OTel messaging spans map to it). Attempts sharing `messaging.message.id` form
        one job; its status is the last attempt's. Running jobs are not visible: an attempt arrives when it ends.
      security:
      - authToken: []
      parameters:
      - name: project
        in: query
        description: Project key. Without it every project is read.
