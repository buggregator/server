        description: '`true` keeps handled errors; any other non-empty value keeps unhandled ones.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - name: from
        in: query
        description: Lower bound on received time. Unix seconds or ISO (RFC3339, `2006-01-02T15:04:05`, `2006-01-02`), UTC.
        schema:
          type: string
      - name: to
        in: query
        description: Upper bound on received time, same formats as `from`.
        schema:
          type: string
      - name: window
