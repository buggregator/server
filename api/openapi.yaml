      - name: to
        in: query
        description: Upper time bound, same formats as `from`. A reversed period is empty.
        schema:
          type: string
      - name: window
        in: query
        description: Used when `from` and `to` are both absent. A duration (`15m`, `24h`, `7d`), whole minutes 1..10080
