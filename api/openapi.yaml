      - Ingestion
      operationId: ingestSentryStore
      summary: Sentry legacy store endpoint (JSON event)
      description: '`project` is the DSN path: a name routes to that project; a number

        (`/api/1/store/`, needed by the JavaScript SDKs) routes by the DSN

        public key when a project with that key exists, else to `default`.

        '
      x-ingestion: true
      security: []
      parameters:
      - $ref: '#/components/parameters/SentryProject'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
