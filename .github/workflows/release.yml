name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger: lets you pick a frontend version without bumping the repo Variable.
  workflow_dispatch:
    inputs:
      frontend_version:
        description: 'Frontend release tag (overrides vars.FRONTEND_VERSION)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

env:
  # Resolution order:
  #   1) workflow_dispatch input (manual one-off)
  #   2) repository Variable `FRONTEND_VERSION` (https://github.com/buggregator/server/settings/variables/actions)
  #   3) hardcoded fallback so the workflow still works on forks without the Variable set.
  FRONTEND_VERSION: ${{ inputs.frontend_version || vars.FRONTEND_VERSION || '1.38.0' }}
  PHP_VERSION: "8.4.19"

jobs:
  # Self-update verifies checksums.txt.sig with the ed25519 public key built
  # into the binary (internal/selfupdate/verify.go). A secret that does not
  # match would ship releases no install can update to: check it first, every
  # other job needs this one, so a mismatch publishes nothing.
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Signing key matches the built-in key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          built="$(grep -o 'releaseKey = "[^"]*"' internal/selfupdate/verify.go | cut -d'"' -f2)"
          test -n "$built" || { echo "releaseKey not found in internal/selfupdate/verify.go"; exit 1; }
          have="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)"
          test "$have" = "$built" || { echo "RELEASE_SIGNING_KEY does not match releaseKey in internal/selfupdate/verify.go"; exit 1; }
          # The install scripts carry the same key as a PEM (ed25519 SPKI prefix + raw key).
          for s in scripts/install.sh scripts/install.ps1; do
            grep -q "MCowBQYDK2VwAyEA$built" "$s" || { echo "$s does not carry releaseKey from internal/selfupdate/verify.go"; exit 1; }
          done

  build-unix:
    runs-on: ubuntu-latest
    needs: signing-key
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            spc_os: linux
            spc_arch: x86_64
          - goos: linux
            goarch: arm64
            spc_os: linux
            spc_arch: aarch64
          - goos: darwin
            goarch: amd64
            spc_os: macos
            spc_arch: x86_64
          - goos: darwin
            goarch: arm64
            spc_os: macos
            spc_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Download frontend
      - name: Download frontend
        run: |
          mkdir -p internal/frontend/dist
          ASSET_URL=$(curl -s "https://api.github.com/repos/buggregator/frontend/releases/tags/${FRONTEND_VERSION}" \
            | jq -r '.assets[0].url')
          curl -sL -H "Accept: application/octet-stream" "$ASSET_URL" -o /tmp/frontend.zip
          unzip -qo /tmp/frontend.zip -d internal/frontend/dist/

      # Build PHP VarDumper parser using pre-built micro.sfx from static-php CDN
      - name: Build VarDumper PHP binary
        run: |
          set -o pipefail
          cd php/vardumper
          composer install --no-dev --optimize-autoloader --quiet
          curl -sL https://github.com/box-project/box/releases/download/4.6.6/box.phar -o box.phar
          php box.phar compile --quiet
          curl -sL "https://dl.static-php.dev/static-php-cli/common/php-${PHP_VERSION}-micro-${{ matrix.spc_os }}-${{ matrix.spc_arch }}.tar.gz" \
            -o /tmp/micro.tar.gz
          mkdir -p /tmp/micro && tar -xzf /tmp/micro.tar.gz -C /tmp/micro/
          mkdir -p ../../modules/vardumper/bin
          OUT=../../modules/vardumper/bin/vardumper-parser-${{ matrix.goos }}-${{ matrix.goarch }}
          # Embedded gzipped (unpacked at start, php_process.go): the macOS
          # micro.sfx is ~40 MB unpacked, the Linux one is already packed.
          cat /tmp/micro/micro.sfx vardumper-parser.phar | gzip -9 -n > "$OUT"
          ls -l "$OUT"
          # A broken pipe would still leave a tiny gzip: the parser is ~10 MB+.
          [ "$(wc -c < "$OUT")" -gt 5000000 ] || { echo "VarDumper parser too small: $OUT"; exit 1; }

      # Build Go binary
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -ldflags="-s -w -X main.version=${VERSION}" -o buggregator-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/buggregator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buggregator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: buggregator-${{ matrix.goos }}-${{ matrix.goarch }}

  # Windows build.
  #
  # VarDumper is not available on Windows: static-php-cli does not ship a
  # `micro.sfx` for Windows, so we can't bundle a standalone PHP runtime, and
  # `box.phar` itself cannot reliably detect composer on the Windows runner
  # (https://github.com/box-project/box/issues/1097). The Go server gates
  # var-dump on `runtime.GOOS != "windows"` so the binary still boots — every
  # other module (Sentry, SMTP, Monolog, Ray, Inspector, Profiler, HTTP-dump,
  # SMS) works normally. The embedded vardumper binary is a stub byte so
  # `go:embed bin/vardumper-parser-windows-<arch>.exe` succeeds.
  build-windows:
    runs-on: ubuntu-latest
    needs: signing-key
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download frontend
        run: |
          mkdir -p internal/frontend/dist
          ASSET_URL=$(curl -s "https://api.github.com/repos/buggregator/frontend/releases/tags/${FRONTEND_VERSION}" \
            | jq -r '.assets[0].url')
          curl -sL -H "Accept: application/octet-stream" "$ASSET_URL" -o /tmp/frontend.zip
          unzip -qo /tmp/frontend.zip -d internal/frontend/dist/

      - name: Create VarDumper placeholder
        run: |
          mkdir -p modules/vardumper/bin
          echo 'placeholder' > modules/vardumper/bin/vardumper-parser-${{ matrix.goos }}-${{ matrix.goarch }}.exe

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # workflow_dispatch builds don't have a v* tag — fall back to "dev".
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="dev"
          fi
          go build -ldflags="-s -w -X main.version=${VERSION}" -o buggregator-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./cmd/buggregator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buggregator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: buggregator-${{ matrix.goos }}-${{ matrix.goarch }}.exe

  docker:
    runs-on: ubuntu-latest
    needs: [signing-key, build-unix]
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_LOGIN }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker meta (Docker Hub)
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: |
            butschster/buggregator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            FRONTEND_VERSION=${{ env.FRONTEND_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Only attach binaries to the GitHub Release on a tag push; the manual
    # workflow_dispatch path is for ad-hoc CI builds (artifacts only).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [signing-key, build-unix, build-windows]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # checksums.txt is what scripts/install.sh and install.ps1 verify against.
      - name: Checksums
        run: |
          mkdir -p dist
          cp artifacts/*/buggregator-* dist/
          cd dist
          sha256sum buggregator-* > checksums.txt
          cat checksums.txt

      # The key was checked against the built-in one in the signing-key job.
      # The private key never leaves the secret: written to a temp file for
      # one command, then removed.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "RELEASE_SIGNING_KEY secret is missing"; exit 1; }
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/checksums.txt -out dist/checksums.txt.sig
          test "$(wc -c < dist/checksums.txt.sig)" -eq 64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # First line of every release; generate_release_notes appends below.
          body: |
            Built with [harnsy](https://harnsy.dev/?utm_source=github&utm_medium=release_notes&utm_campaign=built-with-harnsy&utm_content=buggregator) — the Buggregator team runs its AI agents in harnsy.
          generate_release_notes: true
